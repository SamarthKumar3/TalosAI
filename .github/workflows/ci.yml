name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan complete Git history
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo:ro"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install ".[cli,service,telemetry,dev]" build==1.3.0 twine==7.0.0 bandit==1.9.4 pip-audit==2.10.1
      - run: python -m compileall -q packages/talos/src migrations
      - run: python -m ruff check packages migrations
      - run: python -m ruff format --check packages migrations
      - run: python -m mypy
      - run: python -m bandit -r packages/talos/src/talos --severity-level medium
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip_audit --progress-spinner off
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose --env-file .env.example -f docker-compose.dev.yaml config --quiet
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: runtime, dockerfile: Dockerfile, context: .}
          - {name: web, dockerfile: apps/web/Dockerfile, context: .}
          - {name: sandbox, dockerfile: Dockerfile.sandbox, context: .}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build runtime image
        run: docker build -f '${{ matrix.dockerfile }}' -t 'talos-check:${{ matrix.name }}' '${{ matrix.context }}'
      - name: Fail on High or Critical image vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --scanners vuln --severity HIGH,CRITICAL --exit-code 1
          'talos-check:${{ matrix.name }}'
