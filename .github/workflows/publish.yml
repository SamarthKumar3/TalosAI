name: Publish approved Python release
on:
  workflow_dispatch:
    inputs:
      registry:
        description: Approved destination
        required: true
        type: choice
        options: [testpypi, pypi]
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}-${{ inputs.registry }}
  cancel-in-progress: false
jobs:
  build:
    if: vars.PYPI_PUBLISHING_ENABLED == 'true' && github.actor == 'SamarthKumar3' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require reviewed main commit and matching version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python - <<'PY'
          import os, tomllib
          metadata = tomllib.load(open('pyproject.toml', 'rb'))['project']
          assert metadata['name'] == 'talos-runtime'
          assert os.environ['RELEASE_TAG'] == 'v' + metadata['version']
          PY
      - run: python -m pip install build==1.3.0 twine==7.0.0
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Check package contents
        run: |
          python - <<'PY'
          import pathlib, tarfile, zipfile
          extracted = pathlib.Path('release-extracted')
          extracted.mkdir()
          for artifact in pathlib.Path('dist').iterdir():
              with zipfile.ZipFile(artifact) if artifact.suffix == '.whl' else tarfile.open(artifact) as archive:
                  names = archive.namelist() if isinstance(archive, zipfile.ZipFile) else archive.getnames()
                  for name in names:
                      path = pathlib.PurePosixPath(name)
                      assert not path.is_absolute() and '..' not in path.parts
                      assert not set(path.parts) & {'docs','tests','benchmarks','.talos','.git','node_modules','apps','scripts'}
                      assert path.name not in {'.env','talos.yaml','AGENTS.md','CLAUDE.md'}
                  if isinstance(archive, zipfile.ZipFile):
                      archive.extractall(extracted / artifact.name)
                  else:
                      assert all(member.isfile() or member.isdir() for member in archive.getmembers())
                      archive.extractall(extracted / artifact.name, filter='data')
          PY
      - name: Scan release source for secrets
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo:ro"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
      - run: mkdir -p release-checksums && sha256sum dist/* > release-checksums/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-checksums
          path: release-checksums/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.registry }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-distributions
          path: dist/
      - name: Publish to TestPyPI using a short-lived identity
        if: inputs.registry == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI using a short-lived identity
        if: inputs.registry == 'pypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
