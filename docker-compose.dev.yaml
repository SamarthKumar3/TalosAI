services:
  postgres-dev:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: talos_dev
      POSTGRES_USER: talos
      POSTGRES_PASSWORD: talos-local-only
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talos -d talos_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [talos_dev_data]

  redis-dev:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [talos_dev_data]

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &talos_environment
      DATABASE_URL: postgresql+asyncpg://talos:talos-local-only@postgres-dev:5432/talos_dev
      REDIS_URL: redis://redis-dev:6379/0
      TALOS_REDIS_QUEUE: ${TALOS_REDIS_QUEUE:-talos:jobs}
      TALOS_WORKER_POLL_SECONDS: ${TALOS_WORKER_POLL_SECONDS:-5}
      TALOS_LOG_LEVEL: ${TALOS_LOG_LEVEL:-INFO}
      TALOS_PROJECT_ROOT: /app
      TALOS_API_HOST: 127.0.0.1
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TALOS_LOCAL_API_TOKEN: ${TALOS_LOCAL_API_TOKEN:-}
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks: [talos_dev_data]

  api:
    build: .
    env_file: &talos_config_files
      - path: .env.example
      - path: .env
        required: false
    environment: *talos_environment
    command: ["uvicorn", "talos.api.server:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./config:/app/config
      - ./skills:/app/skills
      - ./tools:/app/tools
      - model_credentials_data:/app/.talos/model-credentials
      - ./.talos/doctor:/app/.talos/doctor
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-dev:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [talos_dev_data]

  worker:
    build: .
    env_file: *talos_config_files
    environment: *talos_environment
    command: ["python", "-m", "talos.worker"]
    volumes:
      - ./config:/app/config:ro
      - ./skills:/app/skills:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-dev:
        condition: service_healthy
    networks: [talos_dev_data]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      TALOS_WEB_API_BASE_URL: http://api:8000
      TALOS_LOCAL_API_TOKEN: ${TALOS_LOCAL_API_TOKEN:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [talos_dev_data]

networks:
  talos_dev_data:

volumes:
  model_credentials_data:
  postgres_dev_data:
  redis_dev_data:
