rrf_k: ${TALOS_RAG_RRF_K}
rerank_enabled: ${TALOS_RAG_RERANK_ENABLED}
rerank_adapter: ${TALOS_RAG_RERANK_ADAPTER}
rerank_model: ${TALOS_RERANK_MODEL}
rerank_api_base: ${TALOS_RERANK_API_BASE}
rerank_api_key_name: ${TALOS_RERANK_API_KEY_NAME}
rerank_timeout_seconds: ${TALOS_RERANK_TIMEOUT_SECONDS}
expansion_synonyms: ${TALOS_RAG_EXPANSION_SYNONYMS}
