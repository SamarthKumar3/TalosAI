schema_version: 1
prompt_path: config/prompts/knowledge-context.md
embedding_model: ${TALOS_LOCAL_EMBEDDING_MODEL}
embedding_adapter: ${TALOS_RAG_EMBEDDING_ADAPTER}
embedding_api_base: ${TALOS_RAG_EMBEDDING_API_BASE}
embedding_api_key_name: ${TALOS_RAG_EMBEDDING_API_KEY_NAME}
embedding_timeout_seconds: ${TALOS_RAG_EMBEDDING_TIMEOUT_SECONDS}
allowed_extensions: ${TALOS_RAG_ALLOWED_EXTENSIONS}
max_pdf_pages: ${TALOS_RAG_MAX_PDF_PAGES}
max_pdf_parse_seconds: ${TALOS_RAG_MAX_PDF_PARSE_SECONDS}
max_query_characters: ${TALOS_RAG_MAX_QUERY_CHARACTERS}
dimensions: ${TALOS_RAG_EMBEDDING_DIMENSIONS}
chunk_characters: ${TALOS_RAG_CHUNK_SIZE}
chunk_overlap: ${TALOS_RAG_CHUNK_OVERLAP}
top_k: ${TALOS_RAG_TOP_K}
similarity_threshold: ${TALOS_RAG_SIMILARITY_THRESHOLD}
